<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloomers: After-School Activities for Ages 8-15</title>

    <!-- styles: Bootstrap, Font Awesome icon styles and custom styles -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.9/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div id="app">
      <!-- navigation bar with brand, descriptionand cart navigation -->
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
          <a class="navbar-brand fw-bold" href="#"
            ><i class="fa-solid fa-seedling me-2"></i>Bloomers</a
          >
          <span class="navbar-text text-light small"
            >After-school activities for emerging minds (Ages 8-15)</span
          >

          <!-- cart navigation -->
          <div class="d-flex align-items-center gap-3">
            <span class="badge bg-light text-dark">
              <i class="fa-solid fa-cart-shopping me-1"></i>
              Cart: {{ totalCartSpaces }}
            </span>
          </div>
        </div>
      </nav>

      <main class="container pb-5">
        <!-- Sorting and Searching lessons by topic, hub, teacher, price or spaces left. -->
        <div class="row g-2 mb-4 align-items-center">
          <div class="col-md-3">
            <div class="input-group">
              <input
                type="text"
                class="form-control"
                placeholder="Search lessons by topic, hub, teacher, price or spaces..."
                v-model="searchQuery"
                @input="handleSearchInput"
              />
              <button
                v-if="searchQuery"
                class="btn btn-outline-secondary"
                type="button"
                @click="clearSearch"
              >
                Clear
              </button>
            </div>
          </div>

          <!-- Option to filter lessons by hub (location) with a dropdown menu. -->
          <div class="col-md-2">
            <select class="form-select" v-model="selectedHub">
              <option value="all">All Hubs (Mauritius)</option>
              <option value="Quatre Bornes">Quatre Bornes</option>
              <option value="Rose Hill">Rose Hill</option>
              <option value="Ébène">Ébène</option>
            </select>
          </div>

          <!-- Option to filter lessons by teacher with a dropdown menu. -->
          <div class="col-md-3">
            <select class="form-select" v-model="selectedTeacher">
              <option value="all">All Teachers</option>
              <option
                v-for="teacher in availableTeachers"
                :key="teacher"
                :value="teacher"
              >
                {{ teacher }}
              </option>
            </select>
          </div>

          <!-- Option to sort lessons by topic, location, price or spaces left in ascending or descending order. -->
          <div class="col-md-2">
            <select class="form-select" v-model="sortBy">
              <option value="topic">Sort by: Topic</option>
              <option value="location">Sort by: Location</option>
              <option value="price">Sort by: Price</option>
              <option value="space">Sort by: Spaces Left</option>
            </select>
          </div>

          <!-- setting the sort order to ascending or descending based on user selection. -->
          <div class="col-md-2">
            <button
              class="btn btn-outline-dark w-100"
              type="button"
              @click="toggleSortOrder"
            >
              <i
                class="fa-solid me-1"
                :class="sortOrder === 'asc' ? 'fa-arrow-up-short-wide' : 'fa-arrow-down-wide-short'"
              ></i>
              {{ sortOrder === 'asc' ? 'Asc' : 'Desc' }}
            </button>
          </div>
        </div>

        <!-- loading state handler -->
        <div v-if="loading" class="alert alert-info">Loading lessons...</div>
        <!-- error handling -->
        <div v-else-if="errorMessage" class="alert alert-danger">
          {{ errorMessage }}
        </div>
        <div v-else class="row g-4">
          <!-- Content for when no errors and not loading -->

          <div
            class="col-md-6 col-lg-4"
            v-for="lesson in sortedLessons"
            :key="lesson.id"
          >
            <div class="card h-100 shadow-sm">
              <img
                :src="`${apiBaseUrl}/images/${lesson.image}`"
                :alt="lesson.topic"
                class="card-img-top"
                style="height: 190px; object-fit: cover"
              />

              <div class="card-body d-flex flex-column">
                <h5 class="card-title">{{ lesson.topic }}</h5>
                <p class="card-text small text-muted mb-1">
                  <i class="fa-solid fa-location-dot me-1"></i> {{
                  lesson.location }}
                </p>
                <p class="card-text small text-muted mb-2">
                  <i class="fa-solid fa-chalkboard-user me-1"></i> {{
                  lesson.teacherFirstName }} {{ lesson.teacherLastName }}
                </p>

                <div
                  class="mt-auto d-flex justify-content-between align-items-center pt-2 border-top"
                >
                  <span class="fw-bold fs-6">Rs. {{ lesson.price }}</span>
                  <span class="badge bg-secondary"
                    >{{lesson.space}} spaces left
                  </span>
                </div>

                <button
                  class="btn btn-primary btn-sm w-100"
                  type="button"
                  :disabled="lesson.space <= 0"
                  @click="addToCart(lesson)"
                >
                <i class="fa-solid fa-plus me-1"></i>
                  {{lesson.space > 0 ? 'Add to Cart' : 'Sold Out'}}
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Vue JS Script -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="app.js"></script>
  </body>
</html>
